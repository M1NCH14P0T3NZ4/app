name: Build APK PortoSicuro
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: |
          pip install flet==0.82.2 httpx

      - name: Accetta licenze Android
        run: yes | flutter doctor --android-licenses

      - name: Build APK (Sostituzione Icona e Nome)
        run: |
          # 1. Inizializziamo il build per PortoSicuro
          flet build apk --no-docker --project PortoSicuro || true
          
          # 2. Sostituzione icone per evitare lo sfondo bianco (Legacy Icon fix)
          sudo apt-get install imagemagick -y
          
          # Creiamo le icone in tutte le densità Android (Sostituiamo ic_launcher)
          declare -A res=( ["mdpi"]="48x48" ["hdpi"]="72x72" ["xhdpi"]="96x96" ["xxhdpi"]="144x144" ["xxxhdpi"]="192x192" )
          for i in "${!res[@]}"; do
            mkdir -p build/flutter/android/app/src/main/res/mipmap-$i
            convert assets/icon.png -resize ${res[$i]} build/flutter/android/app/src/main/res/mipmap-$i/ic_launcher.png
          done
          
          # 3. Lanciamo il build definitivo con il nome PortoSicuro
          yes | flet build apk --project PortoSicuro

      - name: Carica l'APK finale
        uses: actions/upload-artifact@v4
        with:
          name: PortoSicuro_APK
          path: build/apk/*.apk
