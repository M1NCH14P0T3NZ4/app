name: Build APK per Chiara
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5' # Versione compatibile con flet 0.82.2
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: |
          pip install flet==0.82.2 httpx

      - name: Accetta licenze Android
        run: yes | flutter doctor --android-licenses

      - name: Prepara Icone Android (Manuale per 0.82.2)
        run: |
          # Installiamo un tool per generare le icone Android
          flutter pub global activate flutter_launcher_icons
          
          # Creiamo un file di configurazione temporaneo per le icone
          echo "flutter_launcher_icons:
            android: true
            image_path: \"assets/icon.png\"" > flutter_launcher_icons.yaml

      - name: Build APK
        run: |
          # Lanciamo il build normale (senza flag --icon che darebbe errore)
          # Flet 0.82.2 creerà il progetto standard
          yes | flet build apk

      - name: Carica l'APK finale
        uses: actions/upload-artifact@v4
        with:
          name: App_Per_Chiara
          path: build/apk/*.apk
