name: Build APK PortoSicuro
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: 'stable'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installa dipendenze
        run: |
          pip install flet==0.82.2 httpx

      - name: Accetta licenze Android
        run: yes | flutter doctor --android-licenses

      - name: Build APK PortoSicuro
        run: |
          # Costruiamo l'APK specificando il nome del progetto
          yes | flet build apk --project PortoSicuro

      - name: Carica l'APK finale
        uses: actions/upload-artifact@v4
        with:
          name: PortoSicuro_APK
          path: build/apk/*.apk
